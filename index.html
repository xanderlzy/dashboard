<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23111'/%3E%3Cg fill='%23fff'%3E%3Crect x='32' y='40' width='30' height='100' rx='5'/%3E%3Crect x='75' y='40' width='30' height='70' rx='5'/%3E%3Crect x='118' y='40' width='30' height='45' rx='5'/%3E%3C/g%3E%3C/svg%3E">
<script>try{var th=localStorage.getItem("dash.theme");if(th==="light"||th==="dark")document.documentElement.setAttribute("data-theme",th)}catch(e){}</script>
<style>
:root{--bg:#fafafa;--col:#f0f0f0;--card:#fff;--line:#e2e2e2;--text:#111;--mute:#8a8a8a;--accent:#111;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0c;--col:#161616;--card:#1e1e1e;--line:#2c2c2c;--text:#f2f2f2;--mute:#777;--accent:#f2f2f2;--on:#111}}
:root[data-theme="dark"]{--bg:#0c0c0c;--col:#161616;--card:#1e1e1e;--line:#2c2c2c;--text:#f2f2f2;--mute:#777;--accent:#f2f2f2;--on:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
#home,#kanban,#habits,#cal{flex:1;display:flex;flex-direction:column;min-height:0}
#home{padding:0 20px;overflow-y:auto}
.top{display:flex;justify-content:flex-end;padding-top:14px}
#gear{border:0;background:none;color:var(--mute);padding:6px;margin-right:-6px;cursor:pointer;display:flex}
#gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbl{display:block;color:var(--mute);font-size:13px;margin:16px 0 4px}
.nameIn{border-bottom:1px solid var(--line)}
.hero{padding:48px 0 40px}
.hero small{display:block;color:var(--mute);font-size:13px;margin-bottom:10px}
.hero h2{font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:0}
.hero h2 span{color:var(--mute)}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{display:flex;justify-content:space-between;align-items:center;width:100%;padding:20px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:17px;font-weight:600;text-align:left;cursor:pointer}
.tool:active{transform:scale(.99)}
.tool i{font-style:normal;color:var(--mute);font-weight:400;font-size:20px}
#hlist{flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:12px}
#hlist .add{margin:0}
.hb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hn{flex:1;min-width:0;cursor:pointer}
.hn b{display:block;font-weight:600;font-size:16px}
.hs{display:flex;gap:12px;margin-top:3px;font-size:12px;color:var(--mute)}
.hs .u{color:var(--text);font-weight:600}
.ck{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--mute);background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.ck svg{width:20px;height:20px;fill:none;stroke:var(--on);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent))}
.hb.c{border-left:4px solid var(--pc)}
.ck.on svg{opacity:1}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:3px;margin-top:14px}
.hm i{display:block;aspect-ratio:1;border-radius:2.5px;background:var(--line)}
.hm i.on{background:var(--pc,var(--accent))}
.hm .dl{font-size:9px;line-height:1;color:var(--mute);align-self:center;margin-right:3px}
.hm i.f{background:none}
.hm i.t{outline:1.5px solid var(--mute);outline-offset:1px}
@media(min-width:760px){#hlist{width:100%;max-width:720px;margin:0 auto}}
.empty{color:var(--mute);text-align:center;padding:40px 0 20px;font-size:14px}
.hl{display:flex;align-items:baseline;gap:10px}
#back,#hback,#cback{border:0;background:none;color:var(--mute);font-size:26px;line-height:1;padding:0 6px 0 0;cursor:pointer}
header{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
header span{color:var(--mute);font-size:13px}
#board{flex:1;display:flex;gap:12px;padding:4px 20px 20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#board::-webkit-scrollbar{display:none}
.col{flex:0 0 84%;max-width:380px;scroll-snap-align:center;background:var(--col);border-radius:14px;display:flex;flex-direction:column;min-height:0}
@media(min-width:760px){#board{scroll-snap-type:none}.col{flex:1 1 0;max-width:none}}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.ch small{color:var(--mute);font-weight:500}
.list{flex:1;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card:active{transform:scale(.99)}
.card.c{border-left:4px solid var(--pc)}
.due{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.due.u{color:var(--text);font-weight:600}
.dr{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.dr span{color:var(--mute);font-size:13px;margin-right:2px}
.dr input{flex:1;min-width:0;border:0;background:var(--col);border-radius:8px;padding:8px 10px;min-height:36px}
.dr button{border:0;background:var(--col);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}
.dr button.on{background:var(--accent);color:var(--on)}
.sw{display:flex;gap:10px;margin:2px 0 14px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--pc);cursor:pointer;padding:0}
.sw button.on{outline:2px solid var(--text);outline-offset:2px}
.sw button.none{background:var(--col);border:1.5px solid var(--mute)}
.card b{font-weight:600;display:block}
.card ul{list-style:none;margin:8px 0 0;padding:0;color:var(--mute);font-size:13px}
.card li{padding:1px 0}.card li.d{text-decoration:line-through;opacity:.6}
.card li:before{content:"–  "}
.prog{height:2px;background:var(--line);border-radius:2px;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.add{margin:6px 10px 10px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--mute);font:inherit;cursor:pointer}
#sheet,#set,#hs,#as,#ad,#evo{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.on,#set.on,#hs.on,#as.on,#ad.on,#evo.on{display:flex}
.pane{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){#sheet,#set,#hs,#as,#ad,#evo{align-items:center}.pane{border-radius:18px}}
input,button{font:inherit;color:var(--text)}
.t{width:100%;border:0;background:none;font-size:20px;font-weight:600;padding:4px 0;outline:none}
.seg{display:flex;background:var(--col);border-radius:10px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:var(--on)}
.n{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.n input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--mute);border-radius:50%;flex:none;margin:0}
.n input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.n input[type=text]{flex:1;border:0;background:none;outline:none;min-width:0}
.n.d input[type=text]{text-decoration:line-through;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}
.newn{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0;outline:none}
.foot{display:flex;justify-content:space-between;margin-top:18px}
.foot button{border:0;background:none;color:var(--mute);cursor:pointer;padding:6px 0}
.foot .ok{color:var(--text);font-weight:600}
#welcome{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:24px}
.wbox{width:100%;max-width:340px;text-align:center}
.wbox h2{font-size:30px;font-weight:600;letter-spacing:-.03em;margin:18px 0 8px}
.wbox p{color:var(--mute);margin:0}
.wb{width:100%;padding:15px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-weight:600;font-size:16px;margin-top:10px;cursor:pointer}
.wb.p{background:var(--accent);color:var(--on);border-color:var(--accent)}
.wbox .wbs{margin-top:28px}
.wn{color:var(--mute);font-size:12px;margin:16px 0 0}
.ar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.ar small{display:block;color:var(--mute);font-size:12px}
.ar button{border:0;background:var(--col);border-radius:8px;padding:8px 12px;font-size:13px;cursor:pointer;flex:none}
#welcome{overflow-y:auto;align-items:flex-start;justify-content:flex-start}
.wbox{margin:auto}
.wi{width:100%;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-top:10px;font-size:16px;outline:none}
.wr{display:flex;gap:8px}.wr .wb{margin-top:10px;font-size:15px}
.wo{color:var(--mute);font-size:12px;margin:18px 0 6px}
.wl{border:0;background:none;color:var(--mute);font-size:13px;margin-top:12px;cursor:pointer;padding:4px}
.gr{width:22px;height:22px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:18px;line-height:1;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;margin-left:-4px}
.n.drag{background:var(--col);border-radius:8px}
.srt{border:0;background:none;color:var(--mute);font-size:12px;padding:10px 0 0;cursor:pointer}
.hr{display:flex;gap:14px;align-items:baseline}
.hr button{border:0;background:none;color:var(--mute);font-size:13px;cursor:pointer;padding:0}
:root{color-scheme:light dark}:root[data-theme="light"]{color-scheme:light}:root[data-theme="dark"]{color-scheme:dark}
.cn{display:flex;align-items:center;gap:4px;padding:0 20px 8px}
.cn b{flex:1;font-size:17px;font-weight:600}
.cn button{border:0;background:none;color:var(--mute);font-size:24px;line-height:1;padding:2px 10px;cursor:pointer}
.cn .ctd{font-size:13px;padding:6px 8px}
#cbody{flex:1;overflow-y:auto;padding:0 20px 20px}
.cm{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cl{text-align:center;color:var(--mute);font-size:11px;padding:6px 0}
.cd{border:0;background:none;color:var(--text);font:inherit;font-size:14px;aspect-ratio:1/1.1;border-radius:10px;display:flex;flex-direction:column;align-items:center;padding-top:7px;gap:4px;cursor:pointer}
.cd.o{color:var(--mute);opacity:.5}
.cd.t span{font-weight:700;text-decoration:underline;text-underline-offset:3px}
.cd.s{background:var(--accent);color:var(--on)}
.cd i{display:flex;gap:3px;height:5px;font-style:normal}
.cd i b{width:5px;height:5px;border-radius:50%;background:currentColor}
.cdh{font-weight:600;margin:18px 0 8px;font-size:14px}
.ev{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.ev[style]{border-left:4px solid var(--pc)}
.ev b{font-weight:600;display:block}
.ev small{color:var(--mute);font-size:12px}
.ev.dn b{text-decoration:line-through;color:var(--mute)}
.wd{display:flex;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}
.wh{width:38px;flex:none;text-align:center}
.wh b{display:block;font-size:20px;font-weight:600}
.wh span{font-size:11px;color:var(--mute);text-transform:uppercase}
.wd.t .wh b{text-decoration:underline;text-underline-offset:4px}
.wl{flex:1;min-width:0}.wl .ev:last-child{margin-bottom:0}.nn{color:var(--mute)}
.hr button.on{color:var(--text);font-weight:600}
</style>
</head>
<body>
<main id="home" hidden>
<div class="top"><button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
<div class="hero"><small id="date"></small><h2 id="hello"></h2></div>
<nav class="tools" id="tools"></nav>
</main>
<main id="kanban" hidden>
<header><div class="hl"><button id="back" aria-label="Home">&#8249;</button><h1>Kanban</h1></div><span class="hr"><button id="arcb" data-arc="1">Archive</button><span id="count"></span></span></header>
<div id="board"></div>
</main>
<div id="set"><div class="pane"><h3 style="margin:0;font-size:20px">Settings</h3><div id="acct"></div><label class="lbl" for="nameIn">Your name</label><input class="t nameIn" id="nameIn" placeholder="Name" maxlength="30" autocomplete="off"><label class="lbl">Week starts on</label><div class="seg"><button data-ws="0">Sunday</button><button data-ws="1">Monday</button></div><label class="lbl">Theme</label><div class="seg"><button data-th="auto">Auto</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div>
<label class="lbl">Data</label><div class="ar" style="border:0;padding:4px 0 0"><button style="flex:1;padding:11px" data-exp="1">Export backup</button><button style="flex:1;padding:11px" data-imp="1">Import backup</button></div><input type="file" id="impf" accept="application/json,.json" hidden>
<div class="foot"><span></span><button class="ok" data-sclose="1">Done</button></div></div></div>
<main id="habits" hidden>
<header><div class="hl"><button id="hback" aria-label="Home">&#8249;</button><h1>Habits</h1></div><span id="hcount"></span></header>
<div id="hlist"></div>
</main>
<main id="cal" hidden>
<header><div class="hl"><button id="cback" aria-label="Home">&#8249;</button><h1>Calendar</h1></div><span class="hr"><button data-cv="month">Month</button><button data-cv="week">Week</button></span></header>
<div class="cn"><b id="clab"></b><button data-cn="-1" aria-label="Previous">&#8249;</button><button class="ctd" data-cn="0">Today</button><button data-cn="1" aria-label="Next">&#8250;</button><button data-evnew="1" aria-label="Add event">+</button></div>
<div id="cbody"></div>
</main>
<div id="hs"><div class="pane" id="hpane"></div></div>
<div id="welcome" hidden><div class="wbox">
<svg width="56" height="56" viewBox="0 0 180 180"><rect width="180" height="180" rx="36" fill="currentColor"/><g fill="var(--bg)"><rect x="32" y="40" width="30" height="100" rx="5"/><rect x="75" y="40" width="30" height="70" rx="5"/><rect x="118" y="40" width="30" height="45" rx="5"/></g></svg>
<h2>Dashboard</h2><p>Sign in to sync your data across devices and keep it safe.</p>
<div class="wbs"><input class="wi" id="wem" type="email" placeholder="Email" autocomplete="email" autocapitalize="off">
<input class="wi" id="wpw" type="password" placeholder="Password" autocomplete="current-password">
<div class="wr"><button class="wb p" id="wsi">Sign in</button><button class="wb" id="wsu">Create account</button></div>
<button class="wl" id="wfp">Forgot password?</button>
<button class="wb" id="wguest" style="margin-top:22px">Continue as guest</button></div>
<p class="wn">Guest data stays on this device only and is lost if you clear your browser data.</p><p class="wn" id="wmsg"></p>
</div></div>
<div id="as"><div class="pane" id="apane"></div></div>
<div id="ad"><div class="pane" id="adpane"></div></div>
<div id="evo"><div class="pane" id="evpane"></div></div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<script>
var COLS=[["todo","To do"],["doing","In progress"],["done","Done"]];
var KEY="kanban.v1",S=[],cur=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){S=[]}
var PAL=["#e5484d","#f5a524","#46a758","#3e8fe0","#8e6fe0","#e05fa0"];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}push("kanban")}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dueDate(v){var a=v.split("-");return new Date(+a[0],a[1]-1,+a[2])}
function dueInfo(p){
  if(!p.due)return null;
  var d=dueDate(p.due),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var diff=Math.round((d-n)/864e5),done=p.s==="done";
  var short=d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"});
  var t=diff===0?"Due today":diff===1?"Due tomorrow":(diff<0&&!done?"Overdue "+short:"Due "+short);
  return{t:t,u:!done&&diff<=0}
}
function byUrgency(a,b){
  if(!!a[0].due!==!!b[0].due)return a[0].due?-1:1;
  if(a[0].due!==b[0].due)return a[0].due<b[0].due?-1:1;
  return a[1]-b[1]
}
function render(){
  var h="";
  COLS.forEach(function(c){
    var items=S.map(function(p,i){return[p,i]}).filter(function(x){return x[0].s===c[0]&&!x[0].a}).sort(byUrgency).map(function(x){return x[0]});
    h+='<section class="col"><div class="ch">'+c[1]+'<small>'+items.length+'</small></div><div class="list">';
    items.forEach(function(p){
      var done=p.n.filter(function(n){return n.d}).length,pct=p.n.length?done/p.n.length*100:0;
      h+='<div class="card'+(p.c?' c':'')+'" '+(p.c?'style="--pc:'+p.c+'" ':'')+'data-id="'+p.id+'"><b>'+esc(p.t||"Untitled")+'</b>';
      var di=dueInfo(p);if(di)h+='<span class="due'+(di.u?' u':'')+'">'+di.t+'</span>';
      if(p.n.length){h+='<ul>'+p.n.slice(0,3).map(function(n){return'<li class="'+(n.d?"d":"")+'">'+esc(n.x)+'</li>'}).join("")+(p.n.length>3?'<li>+'+(p.n.length-3)+' more</li>':'')+'</ul><div class="prog"><i style="width:'+pct+'%"></i></div>'}
      h+='</div>';
    });
    h+='</div><button class="add" data-add="'+c[0]+'">+ Add project</button></section>';
  });
  document.getElementById("board").innerHTML=h;
  var na=S.filter(function(p){return p.a}).length,nv=S.length-na;document.getElementById("count").textContent=nv+(nv==1?" project":" projects");document.getElementById("arcb").textContent="Archive"+(na?" ("+na+")":"");
}
function sheet(){
  var p=S.find(function(x){return x.id===cur});

  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:fn}).catch(function(){});return}
  var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([txt],{type:"application/json"}));a.download=fn;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(a.href)},1500);
}
function importData(file){
  var r=new FileReader();
  r.onload=function(){
    var d;try{d=JSON.parse(r.result)}catch(e){alert("That file is not a valid backup.");return}
    if(!d||d.app!=="dashboard"||!Array.isArray(d.projects)||!Array.isArray(d.habits)){alert("That file is not a valid Dashboard backup.");return}
    if(!confirm("Replace all current projects and habits with this backup ("+d.projects.length+" projects, "+d.habits.length+" habits)?"))return;
    var cols=COLS.map(function(c){return c[0]});
    S=d.projects.filter(function(p){return p&&p.id}).map(function(p){return{id:String(p.id),t:String(p.t||""),s:cols.indexOf(p.s)>-1?p.s:"todo",c:PAL.indexOf(p.c)>-1?p.c:"",due:/^\d{4}-\d\d-\d\d$/.test(p.due||"")?p.due:"",a:!!p.a,n:(Array.isArray(p.n)?p.n:[]).map(function(n){return{x:String(n&&n.x||""),d:!!(n&&n.d)}})}});
    HB=d.habits.filter(function(b){return b&&b.id}).map(function(b){return{id:String(b.id),n:String(b.n||""),c:PAL.indexOf(b.c)>-1?b.c:"",d:b.d&&typeof b.d==="object"?b.d:{}}});
    if(Array.isArray(d.events))EV=d.events.map(cleanEv).filter(Boolean);
    if(typeof d.name==="string")NAME=d.name;
    WS=d.weekStart===1?1:0;
    lset(NK,NAME);lset(WK,String(WS));save();hsave();evSave();push("settings");render();hrender();crender();home();wsSeg();
    alert("Backup restored.");
  };
  r.readAsText(file);
}
document.getElementById("impf").addEventListener("change",function(e){var f=e.target.files[0];e.target.value="";if(f)importData(f)});
// Account: verification, password, delete
async function resendVerify(){
  try{var f=await fbLoad();await f.A.sendEmailVerification(f.auth.currentUser);setMsg("Verification email sent.")}
  catch(e){setMsg(e.code==="auth/too-many-requests"?"Please wait a bit before resending.":authErr(e))}
}
function adOpen(kind){
  var f='<input class="wi" id="adc" type="password" placeholder="Current password" autocomplete="current-password">',h;
  if(kind==="pw")h='<h3 style="margin:0;font-size:20px">Change password</h3>'+f+'<input class="wi" id="adn" type="password" placeholder="New password (6+ characters)" autocomplete="new-password">';
  else h='<h3 style="margin:0;font-size:20px">Delete account</h3><p class="wn" style="margin:8px 0 0">This permanently deletes your account and all synced data. It cannot be undone. Your backup file is the only way to recover it.</p>'+f;
  h+='<p class="wn" id="admsg"></p><div class="foot"><button data-adx="1">Cancel</button><button class="ok" data-adgo="'+kind+'">'+(kind==="pw"?"Update":"Delete")+'</button></div>';
  document.getElementById("adpane").innerHTML=h;document.getElementById("ad").classList.add("on");
}
async function adGo(kind){
  var m=document.getElementById("admsg"),pw=document.getElementById("adc").value;m.textContent="";
  if(!pw){m.textContent="Enter your current password.";return}
  try{
    var f=await fbLoad(),u=f.auth.currentUser;
    if(!u)throw{code:"auth/network-request-failed"};
    await f.A.reauthenticateWithCredential(u,f.A.EmailAuthProvider.credential(u.email,pw));
    if(kind==="pw"){
      var np=document.getElementById("adn").value;
      if(np.length<6){m.textContent="New password must be at least 6 characters.";return}
      await f.A.updatePassword(u,np);
      document.getElementById("ad").classList.remove("on");alert("Password updated.");return;
    }
    if(!confirm("Delete your account and all synced data permanently?"))return;
    DEL=true;unsubs.forEach(function(x){x()});unsubs=[];Object.keys(ptm).forEach(function(k){clearTimeout(ptm[k])});
    try{
      await Promise.all(["kanban","habits","events","settings"].map(function(k){return f.F.deleteDoc(f.F.doc(f.db,"users",u.uid,"data",k))}));
      await f.A.deleteUser(u);
    }catch(e){alert(authErr(e));location.reload();return}
    wipeLocal();lset(MK,"");DEL=false;
    document.getElementById("ad").classList.remove("on");document.getElementById("set").classList.remove("on");
    location.hash="";acct();showWelcome();
  }catch(e){m.textContent=authErr(e)}
}
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.th){setTheme(t.dataset.th);return}
  if(t.dataset.exp){exportData();return}
  if(t.dataset.imp){document.getElementById("impf").click();return}
  if(t.dataset.resend){resendVerify();return}
  if(t.dataset.ad){adOpen(t.dataset.ad);return}
  if(t.id==="ad"||t.dataset.adx){document.getElementById("ad").classList.remove("on");return}
  if(t.dataset.adgo)adGo(t.dataset.adgo);
});

// ---- Calendar. Events come from pluggable sources, so other calendars (e.g. Google Calendar) can be added later:
// push {id,name,events:function(){return [{id,date:"YYYY-MM-DD",title,color,done,note,go}]}} onto CALSRC.
var CALSRC=[{id:"kanban",name:"Kanban",events:function(){
  return S.filter(function(p){return p.due&&!p.a}).map(function(p){
    var c=COLS.filter(function(x){return x[0]===p.s})[0];
    return{id:"k"+p.id,date:p.due,title:p.t||"Untitled",color:p.c||"",done:p.s==="done",note:"Due"+(c?" \u00b7 "+c[1]:""),go:function(){location.hash="kanban";open(p.id)}};
  });
}}];
var CV=lget("dash.calview")==="week"?"week":"month",CD=new Date(),CEV={};
CD=new Date(CD.getFullYear(),CD.getMonth(),CD.getDate());
function cEvents(){
  var m={};CEV={};
  CALSRC.forEach(function(s){var L=[];try{L=s.events()||[]}catch(e){}L.forEach(function(e){CEV[e.id]=e;(m[e.date]=m[e.date]||[]).push(e)})});
  Object.keys(m).forEach(function(k){m[k].sort(function(a,b){var x=a.time||"~",y=b.time||"~";return x<y?-1:x>y?1:0})});
  return m;
}
function fmtT(v){var a=v.split(":");return new Date(2000,0,1,+a[0],+a[1]).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"})}
function cMeta(e){return[e.time?fmtT(e.time)+(e.end?" \u2013 "+fmtT(e.end):""):"",e.place||"",e.note||""].filter(Boolean).join(" \u00b7 ")}
function cEv(e){return'<div class="ev'+(e.done?" dn":"")+'" data-ce="'+esc(e.id)+'"'+(e.color?' style="--pc:'+e.color+'"':'')+'><b>'+esc(e.title)+'</b>'+(cMeta(e)?'<small>'+esc(cMeta(e))+'</small>':'')+'</div>'}
function crender(){
  var ev=cEvents(),t=new Date(),td=new Date(t.getFullYear(),t.getMonth(),t.getDate()),tk=dkey(td),y=CD.getFullYear(),m=CD.getMonth(),h="",lab,i,d,k,L;
  if(CV==="month"){
    var off=dowIndex(new Date(y,m,1)),n=Math.ceil((off+new Date(y,m+1,0).getDate())/7)*7,sk=dkey(CD);
    lab=CD.toLocaleDateString(undefined,{month:"long",year:"numeric"});
    h='<div class="cm">'+dayLabels().map(function(l){return'<span class="cl">'+l+'</span>'}).join("");
    for(i=0;i<n;i++){
      d=new Date(y,m,1-off+i);k=dkey(d);L=ev[k]||[];
      h+='<button class="cd'+(d.getMonth()!==m?" o":"")+(k===tk?" t":"")+(k===sk?" s":"")+'" data-cd="'+k+'"><span>'+d.getDate()+'</span><i>'+L.slice(0,3).map(function(e){return'<b'+(e.color?' style="background:'+e.color+'"':'')+'></b>'}).join("")+'</i></button>';
    }
    L=ev[sk]||[];
    h+='</div><div class="cdh">'+CD.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"})+'</div>'+(L.length?L.map(cEv).join(""):'<div class="empty" style="padding:14px 0">Nothing due.</div>');
  }else{
    var ws=new Date(y,m,CD.getDate()-dowIndex(CD)),we=new Date(y,m,CD.getDate()-dowIndex(CD)+6);
    lab=ws.toLocaleDateString(undefined,{day:"numeric",month:"short"})+" \u2013 "+we.toLocaleDateString(undefined,{day:"numeric",month:"short",year:"numeric"});
    for(i=0;i<7;i++){
      d=new Date(ws.getFullYear(),ws.getMonth(),ws.getDate()+i);k=dkey(d);L=ev[k]||[];
      h+='<div class="wd'+(k===tk?" t":"")+'" data-dnew="'+k+'"><div class="wh"><b>'+d.getDate()+'</b><span>'+d.toLocaleDateString(undefined,{weekday:"short"})+'</span></div><div class="wl">'+(L.length?L.map(cEv).join(""):'<small class="nn">\u2013</small>')+'</div></div>';
    }
  }
  document.getElementById("clab").textContent=lab;
  document.getElementById("cbody").innerHTML=h;
  [].forEach.call(document.querySelectorAll("[data-cv]"),function(b){b.classList.toggle("on",b.dataset.cv===CV)});
}
function cNav(n){
  if(n===0){var x=new Date();CD=new Date(x.getFullYear(),x.getMonth(),x.getDate())}
  else if(CV==="week")CD=new Date(CD.getFullYear(),CD.getMonth(),CD.getDate()+7*n);
  else{var dim=new Date(CD.getFullYear(),CD.getMonth()+n+1,0).getDate();CD=new Date(CD.getFullYear(),CD.getMonth()+n,Math.min(CD.getDate(),dim))}
  crender();
}
document.addEventListener("click",function(e){
  var t=e.target,c=t.closest&&t.closest("[data-ce]"),b=t.closest&&t.closest("[data-cd]");
  if(c){var v=CEV[c.dataset.ce];if(v&&v.go)v.go();return}
  if(b){CD=dueDate(b.dataset.cd);crender();return}
  var w=t.closest&&t.closest("[data-dnew]");if(w){evOpen(null,w.dataset.dnew);return}
  if(t.dataset.cn!==undefined){cNav(+t.dataset.cn);return}
  if(t.dataset.cv){CV=t.dataset.cv;lset("dash.calview",CV);crender()}
});

// ---- Calendar events (name, date, time, place), stored locally and synced like everything else
var EVK="calendar.v1",EV=[],EVC="";
try{EV=JSON.parse(lget(EVK)||"[]")}catch(e){EV=[]}
function evSave(){lset(EVK,EV);push("events")}
function cleanEv(x){
  var T=/^\d\d:\d\d$/;
  if(!x||!x.id||!/^\d{4}-\d\d-\d\d$/.test(x.d||""))return null;
  return{id:String(x.id),t:String(x.t||""),d:x.d,s:T.test(x.s||"")?x.s:"",e:T.test(x.e||"")?x.e:"",l:String(x.l||"")};
}
CALSRC.push({id:"events",name:"Events",events:function(){
  return EV.map(function(e){return{id:"e"+e.id,date:e.d,title:e.t||"Untitled",time:e.s,end:e.e,place:e.l,go:function(){evOpen(e.id)}}});
}});
function evOpen(id,date){
  var e=id?EV.find(function(x){return x.id===id}):null;EVC=e?e.id:"";
  document.getElementById("evpane").innerHTML=
    '<input class="t" id="evt" placeholder="Event name" maxlength="80" autocomplete="off" value="'+esc(e?e.t:"")+'">'
   +'<div class="dr" style="margin-top:12px"><span>Date</span><input type="date" id="evdate" value="'+(e?e.d:(date||dkey(CD)))+'"></div>'
   +'<div class="dr"><span>Time</span><input type="time" id="evs" value="'+(e?e.s:"")+'"><input type="time" id="eve" value="'+(e?e.e:"")+'"><button data-evad="1" id="evad" class="'+(e&&e.s?"":"on")+'">All day</button></div>'
   +'<input class="newn" id="evl" placeholder="Place (optional)" maxlength="80" value="'+esc(e?e.l:"")+'">'
   +'<p class="wn" id="evmsg" style="margin:10px 0 0"></p>'
   +'<div class="foot">'+(e?'<button data-evdel="1">Delete</button>':'<span></span>')+'<span style="display:flex;gap:18px"><button data-evx="1">Cancel</button><button class="ok" data-evsave="1">Save</button></span></div>';
  document.getElementById("evo").classList.add("on");
  if(!e)setTimeout(function(){var i=document.getElementById("evt");i&&i.focus()},50);
}
function evClose(){document.getElementById("evo").classList.remove("on")}
function evForm(){
  var g=function(i){return document.getElementById(i).value},m=document.getElementById("evmsg");
  var t=g("evt").trim(),d=g("evdate"),s=g("evs"),en=g("eve"),l=g("evl").trim();
  if(!t){m.textContent="Add an event name.";return}
  if(!d){m.textContent="Pick a date.";return}
  if(!s)en="";
  if(s&&en&&en<s){m.textContent="End time must be after the start time.";return}
  var o=EVC?EV.find(function(x){return x.id===EVC}):null;
  if(o){o.t=t;o.d=d;o.s=s;o.e=en;o.l=l}else EV.push({id:uid(),t:t,d:d,s:s,e:en,l:l});
  evSave();evClose();CD=dueDate(d);crender();
}
document.addEventListener("input",function(e){if(e.target.id==="evs"||e.target.id==="eve")document.getElementById("evad").className=document.getElementById("evs").value?"":"on"});
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.dataset.evnew){evOpen(null,dkey(CD));return}
  if(t.dataset.evad){document.getElementById("evs").value="";document.getElementById("eve").value="";t.className="on";return}
  if(t.id==="evo"||t.dataset.evx){evClose();return}
  if(t.dataset.evsave){evForm();return}
  if(t.dataset.evdel&&confirm("Delete this event?")){EV=EV.filter(function(x){return x.id!==EVC});evSave();evClose();crender()}
});
route();
if(!mode())showWelcome();else if(mode()==="google")fbLoad().catch(function(){});
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
