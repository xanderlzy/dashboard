<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Dashboard">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#111111">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%23111'/%3E%3Cg fill='%23fff'%3E%3Crect x='32' y='40' width='30' height='100' rx='5'/%3E%3Crect x='75' y='40' width='30' height='70' rx='5'/%3E%3Crect x='118' y='40' width='30' height='45' rx='5'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#fafafa;--col:#f0f0f0;--card:#fff;--line:#e2e2e2;--text:#111;--mute:#8a8a8a;--accent:#111;--on:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0c0c;--col:#161616;--card:#1e1e1e;--line:#2c2c2c;--text:#f2f2f2;--mute:#777;--accent:#f2f2f2;--on:#111}}
:root[data-theme="dark"]{--bg:#0c0c0c;--col:#161616;--card:#1e1e1e;--line:#2c2c2c;--text:#f2f2f2;--mute:#777;--accent:#f2f2f2;--on:#111}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;display:flex;flex-direction:column;overflow:hidden}
[hidden]{display:none!important}
#home,#kanban,#habits{flex:1;display:flex;flex-direction:column;min-height:0}
#home{padding:0 20px;overflow-y:auto}
.top{display:flex;justify-content:flex-end;padding-top:14px}
#gear{border:0;background:none;color:var(--mute);padding:6px;margin-right:-6px;cursor:pointer;display:flex}
#gear svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.lbl{display:block;color:var(--mute);font-size:13px;margin:16px 0 4px}
.nameIn{border-bottom:1px solid var(--line)}
.hero{padding:48px 0 40px}
.hero small{display:block;color:var(--mute);font-size:13px;margin-bottom:10px}
.hero h2{font-size:36px;line-height:1.1;font-weight:600;letter-spacing:-.03em;margin:0}
.hero h2 span{color:var(--mute)}
.tools{display:flex;flex-direction:column;gap:10px}
.tool{display:flex;justify-content:space-between;align-items:center;width:100%;padding:20px 18px;background:var(--card);border:1px solid var(--line);border-radius:14px;font-size:17px;font-weight:600;text-align:left;cursor:pointer}
.tool:active{transform:scale(.99)}
.tool i{font-style:normal;color:var(--mute);font-weight:400;font-size:20px}
#hlist{flex:1;overflow-y:auto;padding:4px 20px 20px;display:flex;flex-direction:column;gap:12px}
#hlist .add{margin:0}
.hb{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.hh{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hn{flex:1;min-width:0;cursor:pointer}
.hn b{display:block;font-weight:600;font-size:16px}
.hs{display:flex;gap:12px;margin-top:3px;font-size:12px;color:var(--mute)}
.hs .u{color:var(--text);font-weight:600}
.ck{flex:none;width:38px;height:38px;border-radius:50%;border:1.5px solid var(--mute);background:none;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center}
.ck svg{width:20px;height:20px;fill:none;stroke:var(--on);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;opacity:0}
.ck.on{background:var(--pc,var(--accent));border-color:var(--pc,var(--accent))}
.hb.c{border-left:4px solid var(--pc)}
.ck.on svg{opacity:1}
.hm{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,auto);gap:3px;margin-top:14px}
.hm i{display:block;aspect-ratio:1;border-radius:2.5px;background:var(--line)}
.hm i.on{background:var(--pc,var(--accent))}
.hm .dl{font-size:9px;line-height:1;color:var(--mute);align-self:center;margin-right:3px}
.hm i.f{background:none}
.hm i.t{outline:1.5px solid var(--mute);outline-offset:1px}
@media(min-width:760px){#hlist{width:100%;max-width:720px;margin:0 auto}}
.empty{color:var(--mute);text-align:center;padding:40px 0 20px;font-size:14px}
.hl{display:flex;align-items:baseline;gap:10px}
#back,#hback{border:0;background:none;color:var(--mute);font-size:26px;line-height:1;padding:0 6px 0 0;cursor:pointer}
header{padding:18px 20px 12px;display:flex;justify-content:space-between;align-items:baseline}
h1{font-size:22px;font-weight:600;letter-spacing:-.02em;margin:0}
header span{color:var(--mute);font-size:13px}
#board{flex:1;display:flex;gap:12px;padding:4px 20px 20px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
#board::-webkit-scrollbar{display:none}
.col{flex:0 0 84%;max-width:380px;scroll-snap-align:center;background:var(--col);border-radius:14px;display:flex;flex-direction:column;min-height:0}
@media(min-width:760px){#board{scroll-snap-type:none}.col{flex:1 1 0;max-width:none}}
.ch{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 8px;font-weight:600;font-size:13px;text-transform:uppercase;letter-spacing:.08em}
.ch small{color:var(--mute);font-weight:500}
.list{flex:1;overflow-y:auto;padding:4px 10px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;cursor:pointer}
.card:active{transform:scale(.99)}
.card.c{border-left:4px solid var(--pc)}
.due{display:block;font-size:12px;color:var(--mute);margin-top:2px}
.due.u{color:var(--text);font-weight:600}
.dr{display:flex;align-items:center;gap:8px;margin:0 0 12px}
.dr span{color:var(--mute);font-size:13px;margin-right:2px}
.dr input{flex:1;min-width:0;border:0;background:var(--col);border-radius:8px;padding:8px 10px;color-scheme:light dark;min-height:36px}
.dr button{border:0;background:var(--col);border-radius:8px;padding:9px 12px;font-size:13px;cursor:pointer}
.dr button.on{background:var(--accent);color:var(--on)}
.sw{display:flex;gap:10px;margin:2px 0 14px;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid transparent;background:var(--pc);cursor:pointer;padding:0}
.sw button.on{outline:2px solid var(--text);outline-offset:2px}
.sw button.none{background:var(--col);border:1.5px solid var(--mute)}
.card b{font-weight:600;display:block}
.card ul{list-style:none;margin:8px 0 0;padding:0;color:var(--mute);font-size:13px}
.card li{padding:1px 0}.card li.d{text-decoration:line-through;opacity:.6}
.card li:before{content:"–  "}
.prog{height:2px;background:var(--line);border-radius:2px;margin-top:10px}
.prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.add{margin:6px 10px 10px;padding:10px;border:1px dashed var(--line);border-radius:10px;background:none;color:var(--mute);font:inherit;cursor:pointer}
#sheet,#set,#hs{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
#sheet.on,#set.on,#hs.on{display:flex}
.pane{background:var(--bg);width:100%;max-width:520px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px 20px calc(20px + env(safe-area-inset-bottom,0px))}
@media(min-width:760px){#sheet,#set,#hs{align-items:center}.pane{border-radius:18px}}
input,button{font:inherit;color:var(--text)}
.t{width:100%;border:0;background:none;font-size:20px;font-weight:600;padding:4px 0;outline:none}
.seg{display:flex;background:var(--col);border-radius:10px;padding:3px;margin:12px 0}
.seg button{flex:1;border:0;background:none;padding:8px 4px;border-radius:8px;cursor:pointer;font-size:13px}
.seg button.on{background:var(--accent);color:var(--on)}
.n{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.n input[type=checkbox]{appearance:none;-webkit-appearance:none;width:20px;height:20px;border:1.5px solid var(--mute);border-radius:50%;flex:none;margin:0}
.n input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
.n input[type=text]{flex:1;border:0;background:none;outline:none;min-width:0}
.n.d input[type=text]{text-decoration:line-through;color:var(--mute)}
.x{border:0;background:none;color:var(--mute);font-size:18px;cursor:pointer;padding:0 4px}
.newn{width:100%;border:0;border-bottom:1px solid var(--line);background:none;padding:12px 0;outline:none}
.foot{display:flex;justify-content:space-between;margin-top:18px}
.foot button{border:0;background:none;color:var(--mute);cursor:pointer;padding:6px 0}
.foot .ok{color:var(--text);font-weight:600}
</style>
</head>
<body>
<main id="home" hidden>
<div class="top"><button id="gear" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button></div>
<div class="hero"><small id="date"></small><h2 id="hello"></h2></div>
<nav class="tools" id="tools"></nav>
</main>
<main id="kanban" hidden>
<header><div class="hl"><button id="back" aria-label="Home">&#8249;</button><h1>Kanban</h1></div><span id="count"></span></header>
<div id="board"></div>
</main>
<div id="set"><div class="pane"><h3 style="margin:0;font-size:20px">Settings</h3><label class="lbl" for="nameIn">Your name</label><input class="t nameIn" id="nameIn" placeholder="Name" maxlength="30" autocomplete="off"><label class="lbl">Week starts on</label><div class="seg"><button data-ws="0">Sunday</button><button data-ws="1">Monday</button></div><div class="foot"><span></span><button class="ok" data-sclose="1">Done</button></div></div></div>
<main id="habits" hidden>
<header><div class="hl"><button id="hback" aria-label="Home">&#8249;</button><h1>Habits</h1></div><span id="hcount"></span></header>
<div id="hlist"></div>
</main>
<div id="hs"><div class="pane" id="hpane"></div></div>
<div id="sheet"><div class="pane" id="pane"></div></div>
<script>
var COLS=[["todo","To do"],["doing","In progress"],["done","Done"]];
var KEY="kanban.v1",S=[],cur=null;
try{S=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){S=[]}
var PAL=["#e5484d","#f5a524","#46a758","#3e8fe0","#8e6fe0","#e05fa0"];
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function dueDate(v){var a=v.split("-");return new Date(+a[0],a[1]-1,+a[2])}
function dueInfo(p){
  if(!p.due)return null;
  var d=dueDate(p.due),n=new Date();n=new Date(n.getFullYear(),n.getMonth(),n.getDate());
  var diff=Math.round((d-n)/864e5),done=p.s==="done";
  var short=d.toLocaleDateString(undefined,{day:"numeric",month:"short",year:d.getFullYear()===n.getFullYear()?undefined:"numeric"});
  var t=diff===0?"Due today":diff===1?"Due tomorrow":(diff<0&&!done?"Overdue "+short:"Due "+short);
  return{t:t,u:!done&&diff<=0}
}
function byUrgency(a,b){
  if(!!a[0].due!==!!b[0].due)return a[0].due?-1:1;
  if(a[0].due!==b[0].due)return a[0].due<b[0].due?-1:1;
  return a[1]-b[1]
}
function render(){
  var h="";
  COLS.forEach(function(c){
    var items=S.map(function(p,i){return[p,i]}).filter(function(x){return x[0].s===c[0]}).sort(byUrgency).map(function(x){return x[0]});
    h+='<section class="col"><div class="ch">'+c[1]+'<small>'+items.length+'</small></div><div class="list">';
    items.forEach(function(p){
      var done=p.n.filter(function(n){return n.d}).length,pct=p.n.length?done/p.n.length*100:0;
      h+='<div class="card'+(p.c?' c':'')+'" '+(p.c?'style="--pc:'+p.c+'" ':'')+'data-id="'+p.id+'"><b>'+esc(p.t||"Untitled")+'</b>';
      var di=dueInfo(p);if(di)h+='<span class="due'+(di.u?' u':'')+'">'+di.t+'</span>';
      if(p.n.length){h+='<ul>'+p.n.slice(0,3).map(function(n){return'<li class="'+(n.d?"d":"")+'">'+esc(n.x)+'</li>'}).join("")+(p.n.length>3?'<li>+'+(p.n.length-3)+' more</li>':'')+'</ul><div class="prog"><i style="width:'+pct+'%"></i></div>'}
      h+='</div>';
    });
    h+='</div><button class="add" data-add="'+c[0]+'">+ Add project</button></section>';
  });
  document.getElementById("board").innerHTML=h;
  document.getElementById("count").textContent=S.length+(S.length==1?" project":" projects");
}
function sheet(){
  var p=S.find(function(x){return x.id===cur});
  if(!p){document.getElementById("sheet").classList.remove("on");return}
  var h='<input class="t" id="title" placeholder="Project name" value="'+esc(p.t)+'">';
  h+='<div class="sw"><button class="none'+(p.c?'':' on')+'" data-col="" title="No colour"></button>'+PAL.map(function(c){return'<button data-col="'+c+'" style="--pc:'+c+'" class="'+(p.c===c?'on':'')+'"></button>'}).join("")+'</div>';
  h+='<div class="dr"><span>Due</span><input type="date" id="due" value="'+esc(p.due||"")+'"><button data-nodue="1" id="nd" class="'+(p.due?'':'on')+'">No date</button></div>';
  h+='<div class="seg">'+COLS.map(function(c){return'<button data-s="'+c[0]+'" class="'+(p.s===c[0]?"on":"")+'">'+c[1]+'</button>'}).join("")+'</div>';
  p.n.forEach(function(n,i){
    h+='<div class="n'+(n.d?" d":"")+'"><input type="checkbox" data-c="'+i+'"'+(n.d?" checked":"")+'><input type="text" data-e="'+i+'" value="'+esc(n.x)+'"><button class="x" data-r="'+i+'">×</button></div>';
  });
  h+='<input class="newn" id="newn" placeholder="Add a pointer…  (press return)">';
  h+='<div class="foot"><button data-del="1">Delete</button><button class="ok" data-close="1">Done</button></div>';
  document.getElementById("pane").innerHTML=h;
  document.getElementById("sheet").classList.add("on");
}
function open(id){cur=id;sheet()}
function close(){cur=null;document.getElementById("sheet").classList.remove("on");S=S.filter(function(p){return p.t.trim()||p.n.length});save();render()}
document.addEventListener("click",function(e){
  var t=e.target,p=S.find(function(x){return x.id===cur});
  if(t.dataset.add){var np={id:uid(),t:"",s:t.dataset.add,n:[]};S.push(np);save();render();open(np.id);setTimeout(function(){var i=document.getElementById("title");i&&i.focus()},50);return}
  var card=t.closest&&t.closest(".card");if(card){open(card.dataset.id);return}
  if(t.id==="sheet"||t.dataset.close){close();return}
  if(!p)return;
  if(t.dataset.col!==undefined){p.c=t.dataset.col;save();sheet();render()}
  else if(t.dataset.nodue){p.due="";save();sheet();render()}
  else if(t.dataset.s){p.s=t.dataset.s;save();sheet();render()}
  else if(t.dataset.r!==undefined){p.n.splice(+t.dataset.r,1);save();sheet();render()}
  else if(t.dataset.c!==undefined){p.n[+t.dataset.c].d=t.checked;save();sheet();render()}
  else if(t.dataset.del){if(confirm("Delete this project?")){S=S.filter(function(x){return x!==p});save();close()}}
});
document.addEventListener("input",function(e){
  var t=e.target,p=S.find(function(x){return x.id===cur});if(!p)return;
  if(t.id==="title"){p.t=t.value;save()}
  else if(t.id==="due"){p.due=t.value;document.getElementById("nd").className=t.value?"":"on";save();render()}
  else if(t.dataset.e!==undefined){p.n[+t.dataset.e].x=t.value;save()}
});
document.addEventListener("keydown",function(e){
  if(e.key==="Enter"&&e.target.id==="newn"&&e.target.value.trim()){
    var p=S.find(function(x){return x.id===cur});p.n.push({x:e.target.value.trim(),d:false});save();sheet();render();document.getElementById("newn").focus();
  }
});
render();
var NK="dash.name",NAME="";
try{var sv=localStorage.getItem(NK);if(sv!==null)NAME=sv}catch(e){}
var TOOLS=[{id:"kanban",name:"Kanban"},{id:"habits",name:"Habits"}];
function home(){
  var d=new Date(),h=d.getHours(),g=h<12?"Good morning":h<18?"Good afternoon":"Good evening";
  document.getElementById("hello").innerHTML=NAME.trim()?g+',<br><span>'+esc(NAME.trim())+'</span>':g;
  document.getElementById("date").textContent=d.toLocaleDateString(undefined,{weekday:"long",day:"numeric",month:"long"});
  document.getElementById("tools").innerHTML=TOOLS.map(function(t){return'<button class="tool" data-go="'+t.id+'">'+esc(t.name)+'<i>&#8250;</i></button>'}).join("");
}
function route(){
  var id=location.hash.slice(1),on=TOOLS.some(function(t){return t.id===id})?id:"";
  document.getElementById("home").hidden=!!on;
  document.getElementById("kanban").hidden=on!=="kanban";
  document.getElementById("habits").hidden=on!=="habits";
  if(!on)home();
  if(on==="habits")hrender();
}
window.addEventListener("hashchange",route);
document.addEventListener("visibilitychange",function(){if(!document.hidden&&!location.hash.slice(1))home();if(!document.hidden){render();hrender()}});
document.addEventListener("click",function(e){
  var g=e.target.closest&&e.target.closest("[data-go]");
  if(g){location.hash=g.dataset.go;return}
  if(e.target.id==="back"||e.target.id==="hback")location.hash="";
});
var SET=document.getElementById("set"),NI=document.getElementById("nameIn");
document.addEventListener("click",function(e){
  var t=e.target;
  if(t.closest&&t.closest("#gear")){NI.value=NAME;wsSeg();SET.classList.add("on");return}
  if(t.dataset.ws!==undefined){WS=+t.dataset.ws;try{localStorage.setItem(WK,WS)}catch(e){}wsSeg();hrender();return}
  if(t===SET||t.dataset.sclose){SET.classList.remove("on")}
});
NI.addEventListener("input",function(){NAME=NI.value;try{localStorage.setItem(NK,NAME)}catch(e){}home()});
NI.addEventListener("keydown",function(e){if(e.key==="Enter")SET.classList.remove("on")});

// Week start (0 = Sunday, 1 = Monday): use dowIndex() and dayLabels() in any calendar
var WK="dash.ws",WS=0;
try{var wv=localStorage.getItem(WK);if(wv!==null)WS=+wv===1?1:0}catch(e){}
function dowIndex(d){return(d.getDay()-WS+7)%7}
function dayLabels(){var a=["S","M","T","W","T","F","S"];return a.slice(WS).concat(a.slice(0,WS))}
function wsSeg(){[].forEach.call(document.querySelectorAll("[data-ws]"),function(b){b.classList.toggle("on",+b.dataset.ws===WS)})}
var HKEY="habits.v1",HB=[],hcur=null,HN=12,HS=document.getElementById("hs");
try{HB=JSON.parse(localStorage.getItem(HKEY)||"[]")}catch(e){HB=[]}
function hsave(){try{localStorage.setItem(HKEY,JSON.stringify(HB))}catch(e){}}
function dkey(d){var m=d.getMonth()+1,a=d.getDate();return d.getFullYear()+"-"+(m<10?"0":"")+m+"-"+(a<10?"0":"")+a}
function streaks(b){
  var t=new Date(),c=new Date(t.getFullYear(),t.getMonth(),t.getDate()),cur=0;
  if(!b.d[dkey(c)])c.setDate(c.getDate()-1);
  while(b.d[dkey(c)]){cur++;c.setDate(c.getDate()-1)}
  var ks=Object.keys(b.d).sort(),run=0,best=0,prev=null;
  ks.forEach(function(k){var dt=dueDate(k);run=prev&&Math.round((dt-prev)/864e5)===1?run+1:1;if(run>best)best=run;prev=dt});
  return{cur:cur,best:best,total:ks.length}
}
function hweeks(){return window.matchMedia("(min-width:760px)").matches?24:12}
function hrender(){
  HN=hweeks();
  var t=new Date(),td=new Date(t.getFullYear(),t.getMonth(),t.getDate()),tk=dkey(td);
  var y=td.getFullYear(),m=td.getMonth(),o=td.getDate()-dowIndex(td)-(HN-1)*7,h="";
  HB.forEach(function(b){
    var s=streaks(b),cells=dayLabels().map(function(l){return'<span class="dl">'+l+'</span>'}).join("");
    for(var i=0;i<HN*7;i++){
      var d=new Date(y,m,o+i),k=dkey(d);
      cells+=d>td?'<i class="f"></i>':'<i class="'+(b.d[k]?"on":"")+(k===tk?" t":"")+'" data-hk="'+b.id+'" data-d="'+k+'"></i>';
    }
    h+='<section class="hb'+(b.c?" c":"")+'"'+(b.c?' style="--pc:'+b.c+'"':'')+'><div class="hh"><div class="hn" data-hedit="'+b.id+'"><b>'+esc(b.n||"Untitled")+'</b><span class="hs"><span class="'+(s.cur?"u":"")+'">'+(s.cur?s.cur+(s.cur==1?" day":" days")+" streak":"No streak")+'</span><span>Best '+s.best+'</span><span>'+s.total+' total</span></span></div>'
     +'<button class="ck'+(b.d[tk]?" on":"")+'" data-htog="'+b.id+'" aria-label="Mark today"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button></div>'
     +'<div class="hm" style="grid-template-columns:auto repeat('+HN+',1fr)">'+cells+'</div></section>';
  });
  if(!HB.length)h='<div class="empty">No habits yet. Add one to start a streak.</div>';
  h+='<button class="add" data-hadd="1">+ Add habit</button>';
  document.getElementById("hlist").innerHTML=h;
  document.getElementById("hcount").textContent=HB.length+(HB.length==1?" habit":" habits");
}
window.addEventListener("resize",function(){if(hweeks()!==HN)hrender()});
function hfind(id){return HB.find(function(b){return b.id===id})}
function hopen(id){
  var b=hfind(id);if(!b)return;hcur=id;
  document.getElementById("hpane").innerHTML='<input class="t" id="hname" placeholder="Habit name" maxlength="40" autocomplete="off" value="'+esc(b.n)+'"><div class="sw" style="margin-top:12px"><button class="none'+(b.c?'':' on')+'" data-hcol="" title="No colour"></button>'+PAL.map(function(c){return'<button data-hcol="'+c+'" style="--pc:'+c+'" class="'+(b.c===c?'on':'')+'"></button>'}).join("")+'</div><div class="foot"><button data-hdel="1">Delete</button><button class="ok" data-hclose="1">Done</button></div>';
  HS.classList.add("on");
}
function hclose(){hcur=null;HS.classList.remove("on");HB=HB.filter(function(b){return b.n.trim()});hsave();hrender()}
document.addEventListener("click",function(e){
  var t=e.target,x,q=function(a){return t.closest&&t.closest("["+a+"]")};
  if(t.dataset.hcol!==undefined){var hb=hfind(hcur);if(hb){hb.c=t.dataset.hcol;hsave();hopen(hcur);hrender()}return}
  if(t.dataset.hadd){var nb={id:uid(),n:"",d:{}};HB.push(nb);hsave();hrender();hopen(nb.id);setTimeout(function(){var i=document.getElementById("hname");i&&i.focus()},50);return}
  if(x=q("data-htog")){hflip(x.dataset.htog,dkey(new Date()));return}
  if(t.dataset.hk){hflip(t.dataset.hk,t.dataset.d);return}
  if(x=q("data-hedit")){hopen(x.dataset.hedit);return}
  if(t===HS||t.dataset.hclose){hclose();return}
  if(t.dataset.hdel){if(confirm("Delete this habit?")){HB=HB.filter(function(b){return b.id!==hcur});hclose()}}
});
function hflip(id,k){var b=hfind(id);if(!b)return;if(b.d[k])delete b.d[k];else b.d[k]=1;hsave();hrender()}
document.addEventListener("input",function(e){if(e.target.id==="hname"){var b=hfind(hcur);if(b){b.n=e.target.value;hsave();hrender()}}});
document.addEventListener("keydown",function(e){if(e.key==="Enter"&&e.target.id==="hname")hclose()});
route();
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})})}
</script>
